[package]
name = "reqlens"
version = "0.1.13"
edition = "2024"






[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.29"
# Use libc's termios implementation for compatibility with older Linux kernels
# (for example the CentOS hosts where the TUI is commonly used).
crossterm = { version = "0.28", features = ["libc"] }
httparse = "1.9"
signal-hook = "0.3"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3.17"



